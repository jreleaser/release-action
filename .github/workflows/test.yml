name: Test

on:
  push:
  workflow_dispatch:

jobs:
  test:
    name: 'Java ${{ matrix.java }} on ${{ matrix.os }}'
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, macos-15-intel, windows-latest ]
        java: [ 11, 17, 21 ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java }}
          distribution: zulu

      - uses: ./
        with:
          arguments: --version
